<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>AJN TV Hub - Select & Download Channels</title>
    <style>
        :root {
            --primary: #0066cc;
            --primary-dark: #0052a3;
            --secondary: #ffd700;
            --success: #28a745;
            --danger: #dc3545;
            --bg: #1a1a1a;
            --bg-alt: #2d2d2d;
            --text: #ffffff;
            --text-light: #b0b0b0;
            --border: #404040;
            --shadow: 0 2px 8px rgba(0,0,0,0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            padding: 16px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Header */
        .header {
            background: linear-gradient(135deg, #ff006e 0%, #0066cc 50%, #00d9ff 100%);
            padding: 2rem;
            border-radius: 12px;
            text-align: center;
            margin-bottom: 2rem;
            box-shadow: var(--shadow);
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.95;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
        }

        /* Controls */
        .controls {
            background: var(--bg-alt);
            padding: 1.5rem;
            border-radius: 12px;
            margin-bottom: 2rem;
            border: 1px solid var(--border);
        }

        .control-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .control-row:last-child {
            margin-bottom: 0;
        }

        .control-group {
            display: flex;
            flex-direction: column;
        }

        .control-group label {
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--secondary);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input[type="text"],
        select {
            padding: 0.75rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--bg);
            color: var(--text);
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus,
        select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(0,102,204,0.1);
        }

        /* Buttons */
        .button-group {
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
        }

        .btn {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: var(--shadow);
        }

        .btn-success {
            background: var(--success);
            color: white;
        }

        .btn-success:hover {
            background: #218838;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: transparent;
            color: var(--secondary);
            border: 2px solid var(--secondary);
        }

        .btn-secondary:hover {
            background: var(--secondary);
            color: var(--bg);
        }

        /* Stats */
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .stat {
            background: var(--bg-alt);
            padding: 1rem;
            border-radius: 8px;
            text-align: center;
            border-left: 4px solid var(--primary);
        }

        .stat-number {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--secondary);
            margin-bottom: 0.25rem;
        }

        .stat-label {
            font-size: 0.85rem;
            color: var(--text-light);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Channel List */
        .channel-list {
            display: grid;
            gap: 0.5rem;
            max-height: 600px;
            overflow-y: auto;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1rem;
            background: var(--bg-alt);
        }

        .channel-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 0.75rem;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .channel-item:hover {
            background: rgba(0,102,204,0.1);
            border-color: var(--primary);
            transform: translateX(4px);
        }

        .channel-item input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: var(--primary);
        }

        .channel-info {
            flex: 1;
            min-width: 0;
        }

        .channel-name {
            font-weight: 600;
            color: var(--text);
            word-break: break-word;
        }

        .channel-group {
            font-size: 0.85rem;
            color: var(--text-light);
            margin-top: 0.25rem;
        }

        .channel-count {
            background: var(--primary);
            color: white;
            padding: 0.25rem 0.75rem;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            color: var(--text-light);
        }

        .empty-state p {
            font-size: 1.1rem;
            margin-bottom: 1rem;
        }

        /* Loading */
        .loading {
            text-align: center;
            padding: 2rem;
            color: var(--text-light);
        }

        .spinner {
            display: inline-block;
            width: 30px;
            height: 30px;
            border: 3px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 1rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 2rem;
            right: 1rem;
            background: var(--success);
            color: white;
            padding: 1rem 1.5rem;
            border-radius: 8px;
            box-shadow: var(--shadow);
            z-index: 1000;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from {
                transform: translateY(100px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8rem;
            }

            .control-row {
                grid-template-columns: 1fr;
            }

            .channel-list {
                max-height: 400px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>📺 AJN TV Hub</h1>
            <p>Search • Filter • Select • Download Custom Playlists</p>
        </div>

        <!-- Controls -->
        <div class="controls">
            <div class="control-row">
                <div class="control-group">
                    <label>🔍 Search Channels</label>
                    <input type="text" id="searchInput" placeholder="Type channel name...">
                </div>
                <div class="control-group">
                    <label>📂 Select Region</label>
                    <select id="regionSelect">
                        <option value="collection">All Regions (Collection)</option>
                        <option value="usa">USA</option>
                        <option value="canada">Canada</option>
                        <option value="mexico">Mexico</option>
                        <option value="uk">UK</option>
                        <option value="spain">Spain</option>
                        <option value="france">France</option>
                    </select>
                </div>
                <div class="control-group">
                    <label>🏷️ Filter by Group</label>
                    <select id="groupFilter">
                        <option value="">All Groups</option>
                    </select>
                </div>
            </div>

            <!-- Stats -->
            <div class="stats">
                <div class="stat">
                    <div class="stat-number" id="totalChannels">0</div>
                    <div class="stat-label">Total Channels</div>
                </div>
                <div class="stat">
                    <div class="stat-number" id="filteredChannels">0</div>
                    <div class="stat-label">Filtered</div>
                </div>
                <div class="stat">
                    <div class="stat-number" id="selectedChannels">0</div>
                    <div class="stat-label">Selected</div>
                </div>
                <div class="stat">
                    <div class="stat-number" id="totalGroups">0</div>
                    <div class="stat-label">Groups</div>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="button-group">
                <button class="btn btn-primary" onclick="selectAll()">✓ Select All</button>
                <button class="btn btn-primary" onclick="deselectAll()">✗ Deselect All</button>
                <button class="btn btn-success" onclick="downloadSelected()">📥 Download Selected M3U</button>
                <button class="btn btn-secondary" onclick="copySelectedUrls()">📋 Copy URLs</button>
            </div>
        </div>

        <!-- Channel List -->
        <div id="channelContainer">
            <div class="loading">
                <span class="spinner"></span>
                Loading channels...
            </div>
        </div>
    </div>

    <script>
        let allChannels = [];
        let filteredChannels = [];
        let selectedChannels = new Set();
        let currentRegion = 'collection';

        // Load data
        async function loadChannels() {
            try {
                const url = `https://raw.githubusercontent.com/banamine/AJN-Collection-/main/LiveTV/${currentRegion}/LiveTV.json`;
                console.log('Fetching from:', url);

                const response = await fetch(url);
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                const data = await response.json();
                allChannels = [];

                // Flatten channels from all regions
                Object.values(data.regions || {}).forEach(region => {
                    if (Array.isArray(region.channels)) {
                        allChannels.push(...region.channels);
                    } else if (region && typeof region === 'object') {
                        Object.values(region).forEach(item => {
                            if (Array.isArray(item)) {
                                allChannels.push(...item);
                            }
                        });
                    }
                });

                console.log('Loaded channels:', allChannels.length);
                populateGroupFilter();
                renderChannels();
            } catch (error) {
                console.error('Error loading channels:', error);
                document.getElementById('channelContainer').innerHTML = `
                    <div class="empty-state">
                        <p>❌ Failed to load channels</p>
                        <p style="font-size: 0.9rem; color: #888;">${error.message}</p>
                        <p style="font-size: 0.85rem; margin-top: 1rem;">Trying fallback...</p>
                    </div>
                `;
                // Fallback to collection
                if (currentRegion !== 'collection') {
                    currentRegion = 'collection';
                    loadChannels();
                }
            }
        }

        // Populate group filter
        function populateGroupFilter() {
            const groups = [...new Set(allChannels.map(ch => ch.group || 'Uncategorized'))];
            const groupFilter = document.getElementById('groupFilter');
            const currentValue = groupFilter.value;

            groupFilter.innerHTML = '<option value="">All Groups</option>';
            groups.sort().forEach(group => {
                const option = document.createElement('option');
                option.value = group;
                option.textContent = group;
                groupFilter.appendChild(option);
            });

            groupFilter.value = currentValue;
            updateStats();
        }

        // Filter and render channels
        function renderChannels() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const groupFilter = document.getElementById('groupFilter').value;

            filteredChannels = allChannels.filter(channel => {
                const matchesSearch = !search ||
                    channel.name.toLowerCase().includes(search) ||
                    (channel.group && channel.group.toLowerCase().includes(search));

                const matchesGroup = !groupFilter || channel.group === groupFilter;

                return matchesSearch && matchesGroup;
            });

            const container = document.getElementById('channelContainer');

            if (filteredChannels.length === 0) {
                container.innerHTML = '<div class="empty-state"><p>No channels found</p></div>';
                updateStats();
                return;
            }

            container.innerHTML = '<div class="channel-list">' +
                filteredChannels.map((channel, index) => `
                    <div class="channel-item">
                        <input type="checkbox"
                            data-index="${index}"
                            ${selectedChannels.has(index) ? 'checked' : ''}
                            onchange="toggleChannel(${index})">
                        <div class="channel-info">
                            <div class="channel-name">${escapeHtml(channel.name)}</div>
                            <div class="channel-group">${escapeHtml(channel.group || 'Uncategorized')}</div>
                        </div>
                        <div class="channel-count">${filteredChannels.indexOf(channel) + 1}</div>
                    </div>
                `).join('') +
            '</div>';

            updateStats();
        }

        // Toggle channel selection
        function toggleChannel(index) {
            if (selectedChannels.has(index)) {
                selectedChannels.delete(index);
            } else {
                selectedChannels.add(index);
            }
            updateStats();
        }

        // Select/Deselect all
        function selectAll() {
            filteredChannels.forEach((_, index) => {
                selectedChannels.add(index);
            });
            renderChannels();
        }

        function deselectAll() {
            selectedChannels.clear();
            renderChannels();
        }

        // Download selected as M3U
        function downloadSelected() {
            if (selectedChannels.size === 0) {
                showToast('Please select at least one channel');
                return;
            }

            const selected = Array.from(selectedChannels).map(i => filteredChannels[i]);
            const m3uContent = generateM3U(selected);

            const blob = new Blob([m3uContent], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `custom-playlist-${selected.length}ch.m3u`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);

            showToast(`Downloaded ${selected.length} channels`);
        }

        // Copy selected URLs
        function copySelectedUrls() {
            if (selectedChannels.size === 0) {
                showToast('Please select at least one channel');
                return;
            }

            const selected = Array.from(selectedChannels).map(i => filteredChannels[i]);
            const urls = selected.map(ch => ch.url).join('\n');

            navigator.clipboard.writeText(urls).then(() => {
                showToast(`Copied ${selected.length} URLs to clipboard`);
            });
        }

        // Generate M3U content
        function generateM3U(channels) {
            let m3u = '#EXTM3U\n';
            channels.forEach(ch => {
                m3u += `#EXTINF:-1 tvg-name="${escapeHtml(ch.name)}" group-title="${escapeHtml(ch.group || 'Uncategorized')}"`;
                if (ch.logo) {
                    m3u += ` tvg-logo="${ch.logo}"`;
                }
                m3u += `,${ch.name}\n`;
                m3u += `${ch.url}\n`;
            });
            return m3u;
        }

        // Update stats
        function updateStats() {
            document.getElementById('totalChannels').textContent = allChannels.length;
            document.getElementById('filteredChannels').textContent = filteredChannels.length;
            document.getElementById('selectedChannels').textContent = selectedChannels.size;

            const groups = [...new Set(allChannels.map(ch => ch.group || 'Uncategorized'))];
            document.getElementById('totalGroups').textContent = groups.length;
        }

        // Toast notification
        function showToast(message) {
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        // Escape HTML
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Event listeners
        document.getElementById('searchInput').addEventListener('input', renderChannels);
        document.getElementById('groupFilter').addEventListener('change', renderChannels);
        document.getElementById('regionSelect').addEventListener('change', (e) => {
            currentRegion = e.target.value;
            selectedChannels.clear();
            loadChannels();
        });

        // Initialize
        window.addEventListener('load', loadChannels);
    </script>
</body>
</html>
